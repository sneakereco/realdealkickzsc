name: Production Deployment

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate semantic version and main ancestry
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use canonical vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Production tag must point to a commit in main history." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  migrate:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch production deployment secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Fetch production deployment secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Pull Vercel project configuration
        run: npx --yes vercel@59.16.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        run: npx --yes vercel@59.16.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@59.16.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production readiness
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 10 "$DEPLOYMENT_URL/api/readyz"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          exit 1
